[project]
name = "deepdiver"
version = "0.1.0"
description = "Multi-agent autonomous bug bounty hunter: recon, crawl, attack, verify, report"
authors = [{ name = "Nilabh-code", email = "agrobothex@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "openai>=1.60",
    "playwright>=1.49",
    "pydantic>=2.9",
]

[project.scripts]
deepdiver = "deepdiver.cli:main"

[build-system]
requires = ["uv_build>=0.5.0,<0.7.0"]
build-backend = "uv_build"

